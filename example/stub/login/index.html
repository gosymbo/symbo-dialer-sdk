<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Symbo sign-in (stub)</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef1f7;
        color: #101426;
        font: 15px/1.5 system-ui, sans-serif;
      }
      .card {
        background: #fff;
        border: 1px solid #dde1ea;
        border-radius: 8px;
        padding: 28px 32px;
        max-width: 380px;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        color: #5b6479;
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid #1f4fd8;
        background: #1f4fd8;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sign in to Symbo</h1>
      <p>
        This tab stands in for Symbo's login page. In production the rep signs
        in here and the dialer frame picks the session up on its own.
      </p>
      <button id="go">Sign in as Sam Rep</button>
    </div>
    <script>
      // The stub frame reads this flag on load and listens on the channel, the
      // way the real frame listens on a guest realtime channel for the
      // relayed session.
      document.getElementById('go').addEventListener('click', () => {
        localStorage.setItem('symbo-stub:signedIn', '1')
        new BroadcastChannel('symbo-stub').postMessage('signed-in')
        document.querySelector('.card').innerHTML =
          '<h1>Signed in</h1><p>You can close this tab.</p>'
        setTimeout(() => window.close(), 600)
      })
    </script>
  </body>
</html>
