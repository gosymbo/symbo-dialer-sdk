<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stub dialer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eef1f7;
        color: #333;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .strip {
        box-sizing: border-box;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        border: 1px dashed #b8c0d4;
        white-space: nowrap;
        overflow: hidden;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #9aa3b8;
        flex: none;
      }
      .dot.ok {
        background: #1a7f52;
      }
      .dot.warn {
        background: #9a5b12;
      }
      .who {
        font-weight: 600;
      }
      .state {
        color: #5b6479;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid #b8c0d4;
        background: #fff;
        color: #333;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="strip">
      <span class="dot" id="dot"></span>
      <span class="who" id="who">Stub dialer</span>
      <span class="state" id="state">waiting for hello…</span>
      <span class="spacer"></span>
      <button id="ring" title="Ring an inbound call now">Inbound</button>
      <button id="blip" title="Drop the realtime connection for 3 s">Blip</button>
      <button id="auth">Sign in</button>
    </div>
    <script src="stub.js"></script>
  </body>
</html>
